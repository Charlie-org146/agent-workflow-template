# Written by workflow-regression (regression.py workflow). The rows a change reaches; the full suite runs on the schedule only.
name: regression-pr
on:
  pull_request:
  push:
    branches-ignore:
      - "main"
permissions:
  contents: read
  checks: read
concurrency:
  group: regression-pr-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, 'pr:') }}
jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: rec
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          s=false
          if [ -f dev/recordonly.py ] && python3 dev/recordonly.py ${{ github.event.pull_request.head.sha || github.sha }}; then s=true; fi
          echo "skip=$s" >> "$GITHUB_OUTPUT"
      - if: steps.rec.outputs.skip != 'true'
        run: python3 skills/workflow-regression/scripts/regression.py run nightly --reuse --tier goal --timeout 900
