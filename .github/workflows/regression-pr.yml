# Written by workflow-regression (regression.py workflow). The rows a change reaches; the full suite runs on the schedule only.
name: regression-pr
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: regression-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shard:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, tree]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: all.tsv
          key: row-times-${{ github.sha }}
          restore-keys: row-times-
      - run: |
          T=${{ runner.temp }}/t.tsv; D=$(git diff --name-only origin/main...HEAD) || { echo "FAIL cannot read the diff against origin/main: fetch the base (fetch-depth 0) and rerun the shard"; exit 1; }
          printf %s "$D" | grep -qvE '[.]md$|^[.]loop/(goals|kept)/' || { echo "documents and goal records only: no rows to run"; >>$T; exit 0; }
          touch all.tsv; cat .github/workflows/row-times.tsv all.tsv 2>/dev/null | awk -F'	' -v OFS='	' '$3!="CUT"{$3=""}1' >$T; rm all.tsv  # o852: committed times, the cache's over them
          R="python3 skills/workflow-regression/scripts/regression.py run nightly --reuse --tier goal"
          B=866; printf %s "$D" | grep -qE '^[.]loop/regression(-known)?[.]tsv$' && B=-1  # rows changed: no budget, nothing LEFT
          [ "${{ matrix.shard }}" != tree ] || { LOOP_ROW_TIMES=$T $R --tree --timeout 200 --budget -1 && python3 skills/workflow-regression/scripts/cutgate.py $T tree.tsv .loop/regression-skips.tsv; exit $?; }
          LOOP_ROW_TIMES=$T LOOP_PR_SHARD=${{ matrix.shard }}/8 $R --budget $B --timeout 200
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/t.tsv
          if-no-files-found: ignore
  affected:
    needs: shard
    if: always() && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: test ! -f dev/package.py || python3 dev/package.py --static
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: shard-*
          path: s
      - run: python3 skills/workflow-regression/scripts/cutgate.py 's/shard-[0-7]/t.tsv' all.tsv .loop/regression-skips.tsv
      - if: always() && needs.shard.result == 'success'
        uses: actions/cache/save@v4
        with:
          path: all.tsv
          key: row-times-${{ github.sha }}
      - run: test "${{ needs.shard.result }}" = success
  small:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 skills/workflow-docs/scripts/docs.py check
      - run: test ! -f dev/package.py || python3 dev/package.py --static
      - run: find skills -name '*.py' -exec python3 -m py_compile {} +
      - run: python3 skills/workflow-docs/scripts/criteria.py render --check
