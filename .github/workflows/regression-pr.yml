# Written by workflow-regression (regression.py workflow). The rows a change reaches; the full suite runs on the schedule only.
name: regression-pr
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: regression-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shard:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git diff --name-only origin/main...HEAD | grep -qvE '[.]md$|^[.]loop/(goals|kept)/' || { echo "documents and goal records only: no rows to run"; exit 0; }
          LOOP_PR_SHARD=${{ matrix.shard }}/6 python3 skills/workflow-regression/scripts/regression.py run nightly --reuse --tier goal --budget 240 --timeout 200
  affected:
    needs: shard
    if: always() && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.shard.result }}" = success
  small:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 skills/workflow-docs/scripts/docs.py check
      - run: find skills -name '*.py' -exec python3 -m py_compile {} +
      - run: python3 skills/workflow-docs/scripts/criteria.py render --check
