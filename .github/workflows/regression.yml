                  print(line)
                  open(os.path.join(os.environ.get("RUNNER_TEMP") or ".", "l2-verdict.txt"), "w").write(line + "\n")
              return 0 if v["state"] == "GREEN" else 1


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          L2_PY_EOF
