<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 448" role="img" aria-label="How the README, health, the PRD and the code relate">
<style>
.d-t{font:600 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1b2430}
.d-h{font:600 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#566173;letter-spacing:.04em}
.d-b{font:600 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1b2430}
.d-s{font:400 11.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#3c4757}
.d-x{font:400 10.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#566173}
.d-step{fill:#f3f5f8;stroke:#8a94a3}
.d-you{fill:#e4eeff;stroke:#3b6fd6}
.d-gate{fill:#fff4d6;stroke:#c08a00}
.d-find{fill:#fde9e7;stroke:#c5483f}
.d-ok{fill:#e2f5e6;stroke:#2f8f4a}
.d-bg{fill:#ffffff}
.d-a{stroke:#6b7686;stroke-width:1.5;fill:none}
.d-ah{fill:#6b7686}
@media (prefers-color-scheme: dark){
.d-t,.d-b{fill:#eef2f6}.d-h,.d-x{fill:#a3afbf}.d-s{fill:#cdd5df}
.d-step{fill:#222b36;stroke:#5c6b7d}.d-you{fill:#162a4f;stroke:#6d9bf0}
.d-gate{fill:#3a2e0d;stroke:#d9a521}.d-find{fill:#3d1c1a;stroke:#e0736a}
.d-ok{fill:#153420;stroke:#4fb56c}.d-bg{fill:#12171d}.d-a{stroke:#9aa7b8}.d-ah{fill:#9aa7b8}
}
</style>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" class="d-ah"/></marker></defs>
<rect width="420" height="448" class="d-bg"/>
<text x="12" y="24" class="d-t">How principles, health and features fit</text>
<rect x="112" y="40" width="296" height="46" rx="8" class="d-you" stroke-width="1.2"/>
<text x="260.0" y="59.5" text-anchor="middle" class="d-b">README</text>
<text x="260.0" y="74.5" text-anchor="middle" class="d-s">Only the principles and how they are enforced</text>
<path d="M260 86 L260 117" class="d-a" marker-end="url(#ah)"/>
<rect x="144" y="92" width="232" height="18" rx="9" class="d-bg"/>
<text x="260" y="105" text-anchor="middle" class="d-x">the same eight, word for word</text>
<rect x="112" y="118" width="296" height="46" rx="8" class="d-step" stroke-width="1.2"/>
<text x="260.0" y="137.5" text-anchor="middle" class="d-b">Health</text>
<text x="260.0" y="152.5" text-anchor="middle" class="d-s">One verdict for each principle, from its groups</text>
<path d="M260 164 L260 195" class="d-a" marker-end="url(#ah)"/>
<rect x="144" y="170" width="232" height="18" rx="9" class="d-bg"/>
<text x="260" y="183" text-anchor="middle" class="d-x">each principle names its requirements</text>
<rect x="112" y="196" width="296" height="46" rx="8" class="d-step" stroke-width="1.2"/>
<text x="260.0" y="215.5" text-anchor="middle" class="d-b">The PRD, by feature</text>
<text x="260.0" y="230.5" text-anchor="middle" class="d-s">The requirements that make each principle true</text>
<path d="M260 242 L260 273" class="d-a" marker-end="url(#ah)"/>
<rect x="144" y="248" width="232" height="18" rx="9" class="d-bg"/>
<text x="260" y="261" text-anchor="middle" class="d-x">each requirement has a gate or a test</text>
<rect x="112" y="274" width="296" height="46" rx="20" class="d-gate" stroke-width="1.2"/>
<text x="260.0" y="293.5" text-anchor="middle" class="d-b">Gates and tests in the code</text>
<text x="260.0" y="308.5" text-anchor="middle" class="d-s">Refuse a breach; prove each requirement</text>
<path d="M112 297 H53 V141 H111" class="d-a" marker-end="url(#ah)"/>
<rect x="4" y="158" width="98" height="66" rx="8" class="d-step" stroke-width="1.2"/>
<text x="53.0" y="180.0" text-anchor="middle" class="d-b">Results</text>
<text x="53.0" y="195.0" text-anchor="middle" class="d-x">read by health</text>
<text x="53.0" y="210.0" text-anchor="middle" class="d-x">every day</text>
<rect x="10" y="338" width="400" height="62" rx="8" class="d-find" stroke-width="1.2"/>
<text x="210.0" y="358.0" text-anchor="middle" class="d-b">A principle that fails is a finding</text>
<text x="210.0" y="373.0" text-anchor="middle" class="d-s">It becomes an issue on its feature, then a goal</text>
<text x="210.0" y="388.0" text-anchor="middle" class="d-s">that fixes the code or revises the PRD</text>
<rect x="12" y="418" width="14" height="14" rx="3" class="d-you" stroke-width="1.2"/>
<text x="31" y="429" class="d-x">You read</text>
<rect x="96" y="418" width="14" height="14" rx="3" class="d-step" stroke-width="1.2"/>
<text x="115" y="429" class="d-x">Step</text>
<rect x="158" y="418" width="14" height="14" rx="3" class="d-gate" stroke-width="1.2"/>
<text x="177" y="429" class="d-x">Gate</text>
<rect x="220" y="418" width="14" height="14" rx="3" class="d-find" stroke-width="1.2"/>
<text x="239" y="429" class="d-x">Finding</text>
</svg>
