<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" role="img" aria-label="System design: the loop, its owner, the outside systems it uses, and the eight principles that govern each part">
<title>System design: the loop, its surroundings and the eight principles</title>
<style>
.f-t{font:600 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1b2430}
.f-h{font:600 11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#566173;letter-spacing:.05em}
.f-s{font:400 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#27303c}
.f-x{font:400 10.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#566173}
.f-you{fill:#e4eeff;stroke:#3b6fd6}
.f-step{fill:#f3f5f8;stroke:#8a94a3}
.f-gate{fill:#fff4d6;stroke:#c08a00}
.f-ok{fill:#e2f5e6;stroke:#2f8f4a}
.f-find{fill:#fde9e7;stroke:#c5483f}
.f-bg{fill:#ffffff}
.f-a{stroke:#6b7686;stroke-width:1.5;fill:none}
.f-ah{fill:#6b7686}
@media (prefers-color-scheme: dark){
.f-t{fill:#eef2f6}.f-h,.f-x{fill:#a3afbf}.f-s{fill:#e1e7ee}
.f-step{fill:#222b36;stroke:#5c6b7d}.f-you{fill:#162a4f;stroke:#6d9bf0}
.f-gate{fill:#3a2e0d;stroke:#d9a521}.f-find{fill:#3d1c1a;stroke:#e0736a}
.f-ok{fill:#153420;stroke:#4fb56c}.f-bg{fill:#12171d}.f-a{stroke:#9aa7b8}.f-ah{fill:#9aa7b8}
}

.f-sys{fill:#f3f5f8;stroke:#566173;stroke-dasharray:6 4}
.k-shipped{stroke:#8a94a3;stroke-width:1.5}.k-v20{stroke:#d9822b;stroke-width:5}.k-planned{stroke:#8a5cd6;stroke-width:5;stroke-dasharray:10 6}
.p-shipped{fill:#2f8f4a}.p-v20{fill:#d9822b}.p-planned{fill:#8a5cd6}
.f-pill{font:700 10.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#ffffff}
@media (prefers-color-scheme: dark){.k-shipped{stroke:#5c6b7d}.k-v20{stroke:#f0a050}.k-planned{stroke:#b08cf0}.p-shipped{fill:#3d9c58}.p-v20{fill:#c46f1c}.p-planned{fill:#7a4cc6}}
@media (prefers-color-scheme: dark){.f-sys{fill:#181e26;stroke:#8a94a3}}
.f-pr{fill:#3b6fd6}.f-pn{font:700 9.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#ffffff}
.f-chip{fill:#e4eeff;stroke:#3b6fd6}
@media (prefers-color-scheme: dark){.f-pr{fill:#6d9bf0}.f-pn{fill:#12171d}.f-chip{fill:#162a4f;stroke:#6d9bf0}}
</style>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" class="f-ah"/></marker></defs>
<rect width="640" height="560" class="f-bg"/>
<text x="12" y="22" class="f-t">System design: the loop and the eight principles</text>
<text x="12" y="40" class="f-x">A numbered circle on a part names each principle that governs it.</text>
<text x="12" y="62" class="f-h">THE EIGHT PRINCIPLES</text>
<rect x="12" y="70" width="72" height="46" rx="6" class="f-chip" stroke-width="1.2"/>
<circle cx="48" cy="81" r="7.5" class="f-pr"/><text x="48" y="84.5" text-anchor="middle" class="f-pn">1</text>
<text x="48" y="106" text-anchor="middle" class="f-x">Docs-driven</text>
<rect x="89" y="70" width="72" height="46" rx="6" class="f-chip" stroke-width="1.2"/>
<circle cx="125" cy="81" r="7.5" class="f-pr"/><text x="125" y="84.5" text-anchor="middle" class="f-pn">2</text>
<text x="125" y="101" text-anchor="middle" class="f-x">Enforced</text><text x="125" y="112" text-anchor="middle" class="f-x">and kept true</text>
<rect x="166" y="70" width="72" height="46" rx="6" class="f-chip" stroke-width="1.2"/>
<circle cx="202" cy="81" r="7.5" class="f-pr"/><text x="202" y="84.5" text-anchor="middle" class="f-pn">3</text>
<text x="202" y="101" text-anchor="middle" class="f-x">Fast, cheap</text><text x="202" y="112" text-anchor="middle" class="f-x">and small</text>
<rect x="243" y="70" width="72" height="46" rx="6" class="f-chip" stroke-width="1.2"/>
<circle cx="279" cy="81" r="7.5" class="f-pr"/><text x="279" y="84.5" text-anchor="middle" class="f-pn">4</text>
<text x="279" y="101" text-anchor="middle" class="f-x">Private</text><text x="279" y="112" text-anchor="middle" class="f-x">and guarded</text>
<rect x="320" y="70" width="72" height="46" rx="6" class="f-chip" stroke-width="1.2"/>
<circle cx="356" cy="81" r="7.5" class="f-pr"/><text x="356" y="84.5" text-anchor="middle" class="f-pn">5</text>
<text x="356" y="101" text-anchor="middle" class="f-x">Reproducible</text><text x="356" y="112" text-anchor="middle" class="f-x">and portable</text>
<rect x="397" y="70" width="72" height="46" rx="6" class="f-chip" stroke-width="1.2"/>
<circle cx="433" cy="81" r="7.5" class="f-pr"/><text x="433" y="84.5" text-anchor="middle" class="f-pn">6</text>
<text x="433" y="101" text-anchor="middle" class="f-x">Autonomous</text><text x="433" y="112" text-anchor="middle" class="f-x">you decide</text>
<rect x="474" y="70" width="72" height="46" rx="6" class="f-chip" stroke-width="1.2"/>
<circle cx="510" cy="81" r="7.5" class="f-pr"/><text x="510" y="84.5" text-anchor="middle" class="f-pn">7</text>
<text x="510" y="101" text-anchor="middle" class="f-x">Standard,</text><text x="510" y="112" text-anchor="middle" class="f-x" textLength="66" lengthAdjust="spacingAndGlyphs">not home-made</text>
<rect x="551" y="70" width="72" height="46" rx="6" class="f-chip" stroke-width="1.2"/>
<circle cx="587" cy="81" r="7.5" class="f-pr"/><text x="587" y="84.5" text-anchor="middle" class="f-pn">8</text>
<text x="587" y="101" text-anchor="middle" class="f-x">Honest and</text><text x="587" y="112" text-anchor="middle" class="f-x">verified</text>
<rect x="240" y="134" width="160" height="56" rx="8" class="f-you" stroke-width="1.2"/>
<text x="320.0" y="153" text-anchor="middle" class="f-s">The owner</text>
<text x="320.0" y="168" text-anchor="middle" class="f-x">any machine</text>
<circle cx="320.0" cy="178" r="7.5" class="f-pr"/><text x="320.0" y="181.5" text-anchor="middle" class="f-pn">6</text>
<text x="326" y="207" class="f-x">says a goal, answers what is theirs</text>
<path d="M320 190 L320 216" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="216" width="616" height="230" rx="10" class="f-sys" stroke-width="1.2"/>
<text x="24" y="236" class="f-h">AGENT-WORKFLOW-TEMPLATE LOOP</text>
<rect x="28" y="250" width="176" height="68" rx="8" class="f-step" stroke-width="1.2"/>
<text x="116.0" y="269" text-anchor="middle" class="f-s">Documentation</text>
<text x="116.0" y="284" text-anchor="middle" class="f-x">requirements, pages, README</text>
<circle cx="116.0" cy="306" r="7.5" class="f-pr"/><text x="116.0" y="309.5" text-anchor="middle" class="f-pn">1</text>
<rect x="232" y="250" width="176" height="68" rx="8" class="f-step" stroke-width="1.2"/>
<text x="320.0" y="269" text-anchor="middle" class="f-s">Delivery</text>
<text x="320.0" y="284" text-anchor="middle" class="f-x">goal to pull request to release</text>
<circle cx="320.0" cy="306" r="7.5" class="f-pr"/><text x="320.0" y="309.5" text-anchor="middle" class="f-pn">3</text>
<rect x="436" y="250" width="176" height="68" rx="8" class="f-step" stroke-width="1.2"/>
<text x="524.0" y="269" text-anchor="middle" class="f-s">Operation</text>
<text x="524.0" y="284" text-anchor="middle" class="f-x">one session governs the workers</text>
<circle cx="515.0" cy="306" r="7.5" class="f-pr"/><text x="515.0" y="309.5" text-anchor="middle" class="f-pn">6</text>
<circle cx="533.0" cy="306" r="7.5" class="f-pr"/><text x="533.0" y="309.5" text-anchor="middle" class="f-pn">8</text>
<rect x="28" y="346" width="176" height="68" rx="8" class="f-gate" stroke-width="1.2"/>
<text x="116.0" y="365" text-anchor="middle" class="f-s">Checks</text>
<text x="116.0" y="380" text-anchor="middle" class="f-x">docs check, regression, health</text>
<circle cx="98.0" cy="402" r="7.5" class="f-pr"/><text x="98.0" y="405.5" text-anchor="middle" class="f-pn">2</text>
<circle cx="116.0" cy="402" r="7.5" class="f-pr"/><text x="116.0" y="405.5" text-anchor="middle" class="f-pn">3</text>
<circle cx="134.0" cy="402" r="7.5" class="f-pr"/><text x="134.0" y="405.5" text-anchor="middle" class="f-pn">8</text>
<rect x="232" y="346" width="176" height="68" rx="8" class="f-gate" stroke-width="1.2"/>
<text x="320.0" y="365" text-anchor="middle" class="f-s">Guardrails</text>
<text x="320.0" y="380" text-anchor="middle" class="f-x">private, small, reproducible</text>
<circle cx="320.0" cy="402" r="7.5" class="f-pr"/><text x="320.0" y="405.5" text-anchor="middle" class="f-pn">4</text>
<rect x="436" y="346" width="176" height="68" rx="8" class="f-ok" stroke-width="1.2"/>
<text x="524.0" y="365" text-anchor="middle" class="f-s">Setup and release</text>
<text x="524.0" y="380" text-anchor="middle" class="f-x">adopt, settings, versions</text>
<circle cx="524.0" cy="402" r="7.5" class="f-pr"/><text x="524.0" y="405.5" text-anchor="middle" class="f-pn">5</text>
<rect x="28" y="474" width="176" height="56" rx="8" class="f-step" stroke-width="1.2"/>
<text x="116.0" y="493" text-anchor="middle" class="f-s">GitHub</text>
<text x="116.0" y="508" text-anchor="middle" class="f-x">repos, wiki, Actions</text>
<circle cx="116.0" cy="518" r="7.5" class="f-pr"/><text x="116.0" y="521.5" text-anchor="middle" class="f-pn">7</text>
<rect x="232" y="474" width="176" height="56" rx="8" class="f-step" stroke-width="1.2"/>
<text x="320.0" y="493" text-anchor="middle" class="f-s">Agent tools</text>
<text x="320.0" y="508" text-anchor="middle" class="f-x">Claude Code, Codex</text>
<circle cx="320.0" cy="518" r="7.5" class="f-pr"/><text x="320.0" y="521.5" text-anchor="middle" class="f-pn">7</text>
<rect x="436" y="474" width="176" height="56" rx="8" class="f-step" stroke-width="1.2"/>
<text x="524.0" y="493" text-anchor="middle" class="f-s">Machines</text>
<text x="524.0" y="508" text-anchor="middle" class="f-x">the PC and the Mac</text>
<circle cx="524.0" cy="518" r="7.5" class="f-pr"/><text x="524.0" y="521.5" text-anchor="middle" class="f-pn">5</text>
<path d="M116 318 L116 346" class="f-a" marker-end="url(#ah)"/>
<path d="M116 414 L116 474" class="f-a" marker-end="url(#ah)"/>
<path d="M320 318 L320 346" class="f-a" marker-end="url(#ah)"/>
<path d="M320 414 L320 474" class="f-a" marker-end="url(#ah)"/>
<path d="M524 318 L524 346" class="f-a" marker-end="url(#ah)"/>
<path d="M524 414 L524 474" class="f-a" marker-end="url(#ah)"/>
<path d="M204 284 L232 284" class="f-a" marker-end="url(#ah)"/>
<path d="M408 284 L436 284" class="f-a" marker-end="url(#ah)"/>
<text x="12" y="552" class="f-x">C4 model, level 1 (system context). One figure for all principles.</text>
</svg>
