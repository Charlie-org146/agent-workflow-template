<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 356" width="440" role="img" aria-label="Flow of SET-16 One command judges a repo fully migrated: trigger, what the loop does, the check that proves it, the result">
<title>SET-16 One command judges a repo fully migrated</title>
<style>
.f-t{font:600 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1b2430}
.f-h{font:600 11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#566173;letter-spacing:.05em}
.f-s{font:400 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#27303c}
.f-x{font:400 10.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#566173}
.f-you{fill:#e4eeff;stroke:#3b6fd6}
.f-step{fill:#f3f5f8;stroke:#8a94a3}
.f-gate{fill:#fff4d6;stroke:#c08a00}
.f-ok{fill:#e2f5e6;stroke:#2f8f4a}
.f-find{fill:#fde9e7;stroke:#c5483f}
.f-bg{fill:#ffffff}
.f-a{stroke:#6b7686;stroke-width:1.5;fill:none}
.f-ah{fill:#6b7686}
@media (prefers-color-scheme: dark){
.f-t{fill:#eef2f6}.f-h,.f-x{fill:#a3afbf}.f-s{fill:#e1e7ee}
.f-step{fill:#222b36;stroke:#5c6b7d}.f-you{fill:#162a4f;stroke:#6d9bf0}
.f-gate{fill:#3a2e0d;stroke:#d9a521}.f-find{fill:#3d1c1a;stroke:#e0736a}
.f-ok{fill:#153420;stroke:#4fb56c}.f-bg{fill:#12171d}.f-a{stroke:#9aa7b8}.f-ah{fill:#9aa7b8}
}
</style>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" class="f-ah"/></marker></defs>
<rect width="440" height="356" class="f-bg"/>
<text x="12" y="22" class="f-t">SET-16 One command judges a repo fully</text>
<text x="12" y="42" class="f-t">migrated</text>
<rect x="12" y="60" width="416" height="73" rx="8" class="f-you" stroke-width="1.2"/>
<text x="24" y="76" class="f-h">TRIGGER</text>
<text x="24" y="92" class="f-s">Given a clean private repo and a clean public repo, both</text>
<text x="24" y="107" class="f-s">recorded mac with the task registered; when migration-</text>
<text x="24" y="122" class="f-s">check runs</text>
<path d="M220 133 L220 145" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="145" width="416" height="73" rx="8" class="f-step" stroke-width="1.2"/>
<text x="24" y="161" class="f-h">WHAT THE LOOP DOES</text>
<text x="24" y="177" class="f-s">One read-only command lists every gap between a repo and</text>
<text x="24" y="192" class="f-s">the current template, each with a one-line fix, and</text>
<text x="24" y="207" class="f-s">succeeds only when none remain.</text>
<path d="M220 218 L220 230" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="230" width="416" height="43" rx="8" class="f-gate" stroke-width="1.2"/>
<text x="24" y="246" class="f-h">THE CHECK THAT PROVES IT</text>
<text x="24" y="262" class="f-s">migration-clean (not run); 13 more tests</text>
<path d="M220 273 L220 285" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="285" width="416" height="43" rx="8" class="f-ok" stroke-width="1.2"/>
<text x="24" y="301" class="f-h">RESULT</text>
<text x="24" y="317" class="f-s">Each prints MIGRATION OK and exits 0</text>
<text x="12" y="348" class="f-x">Setup | v1.0.28</text>
</svg>
