<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 326" width="440" role="img" aria-label="Flow of GRD-7 CI spends minutes only on runs that matter: trigger, what the loop does, the check that proves it, the result">
<title>GRD-7 CI spends minutes only on runs that matter</title>
<style>
.f-t{font:600 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1b2430}
.f-h{font:600 11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#566173;letter-spacing:.05em}
.f-s{font:400 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#27303c}
.f-x{font:400 10.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#566173}
.f-you{fill:#e4eeff;stroke:#3b6fd6}
.f-step{fill:#f3f5f8;stroke:#8a94a3}
.f-gate{fill:#fff4d6;stroke:#c08a00}
.f-ok{fill:#e2f5e6;stroke:#2f8f4a}
.f-find{fill:#fde9e7;stroke:#c5483f}
.f-bg{fill:#ffffff}
.f-a{stroke:#6b7686;stroke-width:1.5;fill:none}
.f-ah{fill:#6b7686}
@media (prefers-color-scheme: dark){
.f-t{fill:#eef2f6}.f-h,.f-x{fill:#a3afbf}.f-s{fill:#e1e7ee}
.f-step{fill:#222b36;stroke:#5c6b7d}.f-you{fill:#162a4f;stroke:#6d9bf0}
.f-gate{fill:#3a2e0d;stroke:#d9a521}.f-find{fill:#3d1c1a;stroke:#e0736a}
.f-ok{fill:#153420;stroke:#4fb56c}.f-bg{fill:#12171d}.f-a{stroke:#9aa7b8}.f-ah{fill:#9aa7b8}
}
</style>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" class="f-ah"/></marker></defs>
<rect width="440" height="326" class="f-bg"/>
<text x="12" y="22" class="f-t">GRD-7 CI spends minutes only on runs that</text>
<text x="12" y="42" class="f-t">matter</text>
<rect x="12" y="60" width="416" height="43" rx="8" class="f-you" stroke-width="1.2"/>
<text x="24" y="76" class="f-h">TRIGGER</text>
<text x="24" y="92" class="f-s">Given a scheduled round; when its digest is posted</text>
<path d="M220 103 L220 115" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="115" width="416" height="73" rx="8" class="f-step" stroke-width="1.2"/>
<text x="24" y="131" class="f-h">WHAT THE LOOP DOES</text>
<text x="24" y="147" class="f-s">A newer run of the same workflow on the same branch</text>
<text x="24" y="162" class="f-s">cancels the one it replaces, and a heavy job is skipped</text>
<text x="24" y="177" class="f-s">for a change that touches no code.</text>
<path d="M220 188 L220 200" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="200" width="416" height="43" rx="8" class="f-gate" stroke-width="1.2"/>
<text x="24" y="216" class="f-h">THE CHECK THAT PROVES IT</text>
<text x="24" y="232" class="f-s">grd7-round-cost (not run)</text>
<path d="M220 243 L220 255" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="255" width="416" height="43" rx="8" class="f-ok" stroke-width="1.2"/>
<text x="24" y="271" class="f-h">RESULT</text>
<text x="24" y="287" class="f-s">The round cost shows its minutes and Actions minutes</text>
<text x="12" y="318" class="f-x">Guardrails | v0.27.1</text>
</svg>
