</style>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" class="f-ah"/></marker></defs>
<rect width="440" height="371" class="f-bg"/>
<text x="12" y="22" class="f-t">MCH-2 A new machine or account reaches a</text>
<text x="12" y="42" class="f-t">working operation session and its peer link…</text>
<rect x="12" y="60" width="416" height="58" rx="8" class="f-you" stroke-width="1.2"/>
<text x="24" y="76" class="f-h">TRIGGER</text>
<text x="24" y="92" class="f-s">Given a fresh clone and toy home; when machine apply</text>
<text x="24" y="107" class="f-s">runs</text>
<path d="M220 118 L220 130" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="130" width="416" height="73" rx="8" class="f-step" stroke-width="1.2"/>
<text x="24" y="146" class="f-h">WHAT THE LOOP DOES</text>
<text x="24" y="162" class="f-s">Given a fresh clone on a new machine, when machine.py</text>
<text x="24" y="177" class="f-s">apply runs (setup machine), then the operation session</text>
<text x="24" y="192" class="f-s">(its start routine and task, and the reply and govern…</text>
<path d="M220 203 L220 215" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="215" width="416" height="43" rx="8" class="f-gate" stroke-width="1.2"/>
<text x="24" y="231" class="f-h">THE CHECK THAT PROVES IT</text>
<text x="24" y="247" class="f-s">machine-operation-peer (PASS 2026-11-17)</text>
<path d="M220 258 L220 270" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="270" width="416" height="73" rx="8" class="f-ok" stroke-width="1.2"/>
<text x="24" y="286" class="f-h">RESULT</text>
<text x="24" y="302" class="f-s">The operation session, its tasks and the peer link</text>
<text x="24" y="317" class="f-s">exist, check names them when missing, and the output</text>
<text x="24" y="332" class="f-s">names only the owner-only items left</text>
<text x="12" y="363" class="f-x">Machines | since v1.0.57</text>
<rect x="2" y="2" width="436" height="367" rx="6" fill="none" class="k-shipped"/>
<rect x="315" y="8" width="113" height="18" rx="9" class="p-shipped"/><text x="372" y="21" text-anchor="middle" class="f-pill">SHIPPED v1.0.57</text>
