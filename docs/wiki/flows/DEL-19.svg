.f-step{fill:#222b36;stroke:#5c6b7d}.f-you{fill:#162a4f;stroke:#6d9bf0}
.f-gate{fill:#3a2e0d;stroke:#d9a521}.f-find{fill:#3d1c1a;stroke:#e0736a}
.f-ok{fill:#153420;stroke:#4fb56c}.f-bg{fill:#12171d}.f-a{stroke:#9aa7b8}.f-ah{fill:#9aa7b8}
}

.k-shipped{stroke:#8a94a3;stroke-width:1.5}.k-v20{stroke:#d9822b;stroke-width:5}.k-planned{stroke:#8a5cd6;stroke-width:5;stroke-dasharray:10 6}
.p-shipped{fill:#2f8f4a}.p-v20{fill:#d9822b}.p-planned{fill:#8a5cd6}
.f-pill{font:700 10.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#ffffff}
@media (prefers-color-scheme: dark){.k-shipped{stroke:#5c6b7d}.k-v20{stroke:#f0a050}.k-planned{stroke:#b08cf0}.p-shipped{fill:#3d9c58}.p-v20{fill:#c46f1c}.p-planned{fill:#7a4cc6}}
</style>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" class="f-ah"/></marker></defs>
<rect width="440" height="344" class="f-bg"/>
<text x="12" y="22" class="f-t">DEL-19 The goal loop: one change, one</text>
<text x="12" y="42" class="f-t">goal, one fixed format</text>
<rect x="12.0" y="82" width="416.0" height="48" rx="8" class="f-step" stroke-width="1.2"/>
<text x="220.0" y="101" text-anchor="middle" class="f-s">19.1 A goal is one change, written in one fixed file</text>
<text x="220.0" y="118" text-anchor="middle" class="f-s">format</text>
<rect x="12.0" y="144" width="416.0" height="48" rx="8" class="f-step" stroke-width="1.2"/>
<text x="220.0" y="163" text-anchor="middle" class="f-s">19.2 Every goal runs the same steps in its own worktree</text>
<text x="220.0" y="180" text-anchor="middle" class="f-s">and session</text>
<rect x="12.0" y="206" width="416.0" height="48" rx="8" class="f-step" stroke-width="1.2"/>
<text x="220.0" y="225" text-anchor="middle" class="f-s">19.3 Main changes only through a goal&#x27;s pull request,</text>
<text x="220.0" y="242" text-anchor="middle" class="f-s">merged when every check is green on its exact head</text>
<rect x="12.0" y="268" width="416.0" height="48" rx="8" class="f-step" stroke-width="1.2"/>
<text x="220.0" y="287" text-anchor="middle" class="f-s">19.4 The goal format and its steps are drawn on one page,</text>
