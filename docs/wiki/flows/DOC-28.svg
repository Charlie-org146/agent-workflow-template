<text x="12" y="22" class="f-t">DOC-28 Releases: a frozen release</text>
<text x="12" y="42" class="f-t">brief picks the tasks for a cut</text>
<rect x="12.0" y="82" width="416.0" height="31" rx="8" class="f-step" stroke-width="1.2"/>
<text x="220.0" y="101" text-anchor="middle" class="f-s">28.1 Three kinds of release, each with one job</text>
<rect x="12.0" y="127" width="416.0" height="48" rx="8" class="f-step" stroke-width="1.2"/>
<text x="220.0" y="146" text-anchor="middle" class="f-s">28.2 Before a major or minor, I write a release brief and</text>
<text x="220.0" y="163" text-anchor="middle" class="f-s">freeze it</text>
<rect x="12.0" y="189" width="416.0" height="31" rx="8" class="f-step" stroke-width="1.2"/>
<text x="220.0" y="208" text-anchor="middle" class="f-s">28.3 A release contains exactly the tasks its brief names</text>
<rect x="12.0" y="234" width="416.0" height="48" rx="8" class="f-step" stroke-width="1.2"/>
<text x="220.0" y="253" text-anchor="middle" class="f-s">28.4 The cut happens when every task in the brief is done,</text>
<text x="220.0" y="270" text-anchor="middle" class="f-s">in the brief&#x27;s order, and the gate for its kind passes</text>
