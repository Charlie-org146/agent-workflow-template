<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 356" width="440" role="img" aria-label="Flow of SET-14 The connectors each repo needs are checked: trigger, what the loop does, the check that proves it, the result">
<title>SET-14 The connectors each repo needs are checked</title>
<style>
.f-t{font:600 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1b2430}
.f-h{font:600 11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#566173;letter-spacing:.05em}
.f-s{font:400 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#27303c}
.f-x{font:400 10.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#566173}
.f-you{fill:#e4eeff;stroke:#3b6fd6}
.f-step{fill:#f3f5f8;stroke:#8a94a3}
.f-gate{fill:#fff4d6;stroke:#c08a00}
.f-ok{fill:#e2f5e6;stroke:#2f8f4a}
.f-find{fill:#fde9e7;stroke:#c5483f}
.f-bg{fill:#ffffff}
.f-a{stroke:#6b7686;stroke-width:1.5;fill:none}
.f-ah{fill:#6b7686}
@media (prefers-color-scheme: dark){
.f-t{fill:#eef2f6}.f-h,.f-x{fill:#a3afbf}.f-s{fill:#e1e7ee}
.f-step{fill:#222b36;stroke:#5c6b7d}.f-you{fill:#162a4f;stroke:#6d9bf0}
.f-gate{fill:#3a2e0d;stroke:#d9a521}.f-find{fill:#3d1c1a;stroke:#e0736a}
.f-ok{fill:#153420;stroke:#4fb56c}.f-bg{fill:#12171d}.f-a{stroke:#9aa7b8}.f-ah{fill:#9aa7b8}
}

.k-shipped{stroke:#8a94a3;stroke-width:1.5}.k-v20{stroke:#d9822b;stroke-width:5}.k-v21{stroke:#8a5cd6;stroke-width:5;stroke-dasharray:10 6}
.p-shipped{fill:#2f8f4a}.p-v20{fill:#d9822b}.p-v21{fill:#8a5cd6}
.f-pill{font:700 10.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#ffffff}
@media (prefers-color-scheme: dark){.k-shipped{stroke:#5c6b7d}.k-v20{stroke:#f0a050}.k-v21{stroke:#b08cf0}.p-shipped{fill:#3d9c58}.p-v20{fill:#c46f1c}.p-v21{fill:#7a4cc6}}
</style>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" class="f-ah"/></marker></defs>
<rect width="440" height="356" class="f-bg"/>
<text x="12" y="22" class="f-t">SET-14 The connectors each repo needs are</text>
<text x="12" y="42" class="f-t">checked</text>
<rect x="12" y="60" width="416" height="58" rx="8" class="f-you" stroke-width="1.2"/>
<text x="24" y="76" class="f-h">TRIGGER</text>
<text x="24" y="92" class="f-s">Given followed repos whose PRDs name connectors; when</text>
<text x="24" y="107" class="f-s">the connectors are listed</text>
<path d="M220 118 L220 130" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="130" width="416" height="73" rx="8" class="f-step" stroke-width="1.2"/>
<text x="24" y="146" class="f-h">WHAT THE LOOP DOES</text>
<text x="24" y="162" class="f-s">For each followed repo, setup reads which connectors its</text>
<text x="24" y="177" class="f-s">feature pages need and probes each with a read-only</text>
<text x="24" y="192" class="f-s">call.</text>
<path d="M220 203 L220 215" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="215" width="416" height="43" rx="8" class="f-gate" stroke-width="1.2"/>
<text x="24" y="231" class="f-h">THE CHECK THAT PROVES IT</text>
<text x="24" y="247" class="f-s">adopt-connectors-probed (not run)</text>
<path d="M220 258 L220 270" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="270" width="416" height="58" rx="8" class="f-ok" stroke-width="1.2"/>
<text x="24" y="286" class="f-h">RESULT</text>
<text x="24" y="302" class="f-s">Each is connected, needs sign-in or missing from a read-</text>
<text x="24" y="317" class="f-s">only probe, and nothing is enabled</text>
<text x="12" y="348" class="f-x">Setup | r2 reworded (since v0.27.33)</text>
<rect x="2" y="2" width="436" height="352" rx="6" fill="none" class="k-v20"/>
<rect x="371" y="8" width="57" height="18" rx="9" class="p-v20"/><text x="400" y="21" text-anchor="middle" class="f-pill">v2.0 r2</text>
</svg>
