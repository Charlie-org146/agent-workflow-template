<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" class="f-ah"/></marker></defs>
<rect width="440" height="321" class="f-bg"/>
<text x="12" y="22" class="f-t">GRD-22 A goal learns at qa that it doesn't fit</text>
<rect x="12" y="40" width="416" height="73" rx="8" class="f-you" stroke-width="1.2"/>
<text x="24" y="56" class="f-h">TRIGGER</text>
<text x="24" y="72" class="f-s">A goal that adds a shipped file or grows a script past a</text>
<text x="24" y="87" class="f-s">package limit is refused at qa, not at release, unless</text>
<text x="24" y="102" class="f-s">it frees as much room as it takes.</text>
