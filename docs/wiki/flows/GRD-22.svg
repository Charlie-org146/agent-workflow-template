<text x="24" y="157" class="f-s">The refusal says how much room is left and what would</text>
<text x="24" y="172" class="f-s">free it.</text>
<path d="M220 183 L220 195" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="195" width="416" height="43" rx="8" class="f-find" stroke-width="1.2"/>
<text x="24" y="211" class="f-h">THE CHECK THAT PROVES IT</text>
<text x="24" y="227" class="f-s">No test names this requirement yet</text>
<path d="M220 238 L220 250" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="250" width="416" height="43" rx="8" class="f-ok" stroke-width="1.2"/>
<text x="24" y="266" class="f-h">RESULT</text>
<text x="24" y="282" class="f-s">As stated: A goal learns at qa that it doesn't fit</text>
<text x="12" y="313" class="f-x">Guardrails | v1.0.75</text>
