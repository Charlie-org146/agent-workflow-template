<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 336" width="440" role="img" aria-label="Flow of SET-10 The right format for every agent: trigger, what the loop does, the check that proves it, the result">
<title>SET-10 The right format for every agent</title>
<style>
.f-t{font:600 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1b2430}
.f-h{font:600 11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#566173;letter-spacing:.05em}
.f-s{font:400 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#27303c}
.f-x{font:400 10.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#566173}
.f-you{fill:#e4eeff;stroke:#3b6fd6}
.f-step{fill:#f3f5f8;stroke:#8a94a3}
.f-gate{fill:#fff4d6;stroke:#c08a00}
.f-ok{fill:#e2f5e6;stroke:#2f8f4a}
.f-find{fill:#fde9e7;stroke:#c5483f}
.f-bg{fill:#ffffff}
.f-a{stroke:#6b7686;stroke-width:1.5;fill:none}
.f-ah{fill:#6b7686}
@media (prefers-color-scheme: dark){
.f-t{fill:#eef2f6}.f-h,.f-x{fill:#a3afbf}.f-s{fill:#e1e7ee}
.f-step{fill:#222b36;stroke:#5c6b7d}.f-you{fill:#162a4f;stroke:#6d9bf0}
.f-gate{fill:#3a2e0d;stroke:#d9a521}.f-find{fill:#3d1c1a;stroke:#e0736a}
.f-ok{fill:#153420;stroke:#4fb56c}.f-bg{fill:#12171d}.f-a{stroke:#9aa7b8}.f-ah{fill:#9aa7b8}
}

.k-shipped{stroke:#8a94a3;stroke-width:1.5}.k-v20{stroke:#d9822b;stroke-width:5}.k-v21{stroke:#8a5cd6;stroke-width:5;stroke-dasharray:10 6}
.p-shipped{fill:#2f8f4a}.p-v20{fill:#d9822b}.p-v21{fill:#8a5cd6}
.f-pill{font:700 10.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#ffffff}
@media (prefers-color-scheme: dark){.k-shipped{stroke:#5c6b7d}.k-v20{stroke:#f0a050}.k-v21{stroke:#b08cf0}.p-shipped{fill:#3d9c58}.p-v20{fill:#c46f1c}.p-v21{fill:#7a4cc6}}
</style>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" class="f-ah"/></marker></defs>
<rect width="440" height="336" class="f-bg"/>
<text x="12" y="22" class="f-t">SET-10 The right format for every agent</text>
<rect x="12" y="40" width="416" height="43" rx="8" class="f-you" stroke-width="1.2"/>
<text x="24" y="56" class="f-h">TRIGGER</text>
<text x="24" y="72" class="f-s">Given a repo; when setup or agents.py wire runs</text>
<path d="M220 83 L220 95" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="95" width="416" height="73" rx="8" class="f-step" stroke-width="1.2"/>
<text x="24" y="111" class="f-h">WHAT THE LOOP DOES</text>
<text x="24" y="127" class="f-s">The same skills are wired into each agent's own entry</text>
<text x="24" y="142" class="f-s">files, so Claude Code, Codex and other skill-reading</text>
<text x="24" y="157" class="f-s">agents run the same loop the same way.</text>
<path d="M220 168 L220 180" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="180" width="416" height="43" rx="8" class="f-gate" stroke-width="1.2"/>
<text x="24" y="196" class="f-h">THE CHECK THAT PROVES IT</text>
<text x="24" y="212" class="f-s">agents-wire (PASS 2026-11-12)</text>
<path d="M220 223 L220 235" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="235" width="416" height="73" rx="8" class="f-ok" stroke-width="1.2"/>
<text x="24" y="251" class="f-h">RESULT</text>
<text x="24" y="267" class="f-s">CLAUDE.md and AGENTS.md hold the same workflow-loop</text>
<text x="24" y="282" class="f-s">block, text outside it is kept, and a second run changes</text>
<text x="24" y="297" class="f-s">nothing</text>
<text x="12" y="328" class="f-x">Setup | r2 reworded (since v0.22.0)</text>
<rect x="2" y="2" width="436" height="332" rx="6" fill="none" class="k-v20"/>
<rect x="371" y="8" width="57" height="18" rx="9" class="p-v20"/><text x="400" y="21" text-anchor="middle" class="f-pill">v2.0 r2</text>
</svg>
