<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" class="f-ah"/></marker></defs>
<rect width="440" height="371" class="f-bg"/>
<text x="12" y="22" class="f-t">REL-9 The merge's wiki check refuses only for</text>
<text x="12" y="42" class="f-t">what the goal changed</text>
<rect x="12" y="60" width="416" height="73" rx="8" class="f-you" stroke-width="1.2"/>
<text x="24" y="76" class="f-h">TRIGGER</text>
<text x="24" y="92" class="f-s">Given a goal whose diff changes no wiki page while other</text>
<text x="24" y="107" class="f-s">pages carry DOC-19 or DOC-4 findings, or pages only</text>
<text x="24" y="122" class="f-s">merge.py's own re-render changed; when merge.py checks…</text>
<path d="M220 133 L220 145" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="145" width="416" height="73" rx="8" class="f-step" stroke-width="1.2"/>
<text x="24" y="161" class="f-h">WHAT THE LOOP DOES</text>
<text x="24" y="177" class="f-s">merge.py refuses a DOC-19 or DOC-4 finding on a page the</text>
<text x="24" y="192" class="f-s">goal's diff changes (a How-to-use page counts as changed</text>
<text x="24" y="207" class="f-s">when its feature page is), a page the diff made stale…</text>
<path d="M220 218 L220 230" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="230" width="416" height="58" rx="8" class="f-gate" stroke-width="1.2"/>
<text x="24" y="246" class="f-h">THE CHECK THAT PROVES IT</text>
<text x="24" y="262" class="f-s">gate-untouched-not-refused (PASS 2026-11-18); 12 more</text>
<text x="24" y="277" class="f-s">tests</text>
<path d="M220 288 L220 300" class="f-a" marker-end="url(#ah)"/>
<rect x="12" y="300" width="416" height="43" rx="8" class="f-ok" stroke-width="1.2"/>
<text x="24" y="316" class="f-h">RESULT</text>
<text x="24" y="332" class="f-s">It does not refuse on them</text>
<text x="12" y="363" class="f-x">Release | r2 merge.py re-renders other pages Tests tables on the goal… (since v0.1.2)</text>
<rect x="2" y="2" width="436" height="367" rx="6" fill="none" class="k-v20"/>
<rect x="371" y="8" width="57" height="18" rx="9" class="p-v20"/><text x="400" y="21" text-anchor="middle" class="f-pill">v2.0 r2</text>
</svg>
