<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 371" width="440" role="img" aria-label="Flow of REL-9 The merge's wiki check refuses only for what the goal changed: trigger, what the loop does, the check that proves it, the result">
<title>REL-9 The merge's wiki check refuses only for what the goal changed</title>
<style>
