<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 794" role="img" aria-label="How the documentation-driven principle is enforced">
<style>
.d-t{font:600 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1b2430}
.d-h{font:600 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#566173;letter-spacing:.04em}
.d-b{font:600 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1b2430}
.d-s{font:400 11.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#3c4757}
.d-x{font:400 10.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#566173}
.d-step{fill:#f3f5f8;stroke:#8a94a3}
.d-you{fill:#e4eeff;stroke:#3b6fd6}
.d-gate{fill:#fff4d6;stroke:#c08a00}
.d-find{fill:#fde9e7;stroke:#c5483f}
.d-ok{fill:#e2f5e6;stroke:#2f8f4a}
.d-bg{fill:#ffffff}
.d-a{stroke:#6b7686;stroke-width:1.5;fill:none}
.d-ah{fill:#6b7686}
@media (prefers-color-scheme: dark){
.d-t,.d-b{fill:#eef2f6}.d-h,.d-x{fill:#a3afbf}.d-s{fill:#cdd5df}
.d-step{fill:#222b36;stroke:#5c6b7d}.d-you{fill:#162a4f;stroke:#6d9bf0}
.d-gate{fill:#3a2e0d;stroke:#d9a521}.d-find{fill:#3d1c1a;stroke:#e0736a}
.d-ok{fill:#153420;stroke:#4fb56c}.d-bg{fill:#12171d}.d-a{stroke:#9aa7b8}.d-ah{fill:#9aa7b8}
}
</style>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" class="d-ah"/></marker></defs>
<rect width="420" height="794" class="d-bg"/>
<text x="12" y="24" class="d-t">Principle 1: documentation-driven</text>
<rect x="112" y="40" width="296" height="46" rx="8" class="d-you" stroke-width="1.2"/>
<text x="260.0" y="59.5" text-anchor="middle" class="d-b">You</text>
<text x="260.0" y="74.5" text-anchor="middle" class="d-s">Write or change a requirement</text>
<path d="M260 86 L260 99" class="d-a" marker-end="url(#ah)"/>
<rect x="112" y="100" width="296" height="42" rx="20" class="d-gate" stroke-width="1.2"/>
<text x="260.0" y="117.5" text-anchor="middle" class="d-b">Only your words mark it Reviewed</text>
<text x="260.0" y="132.5" text-anchor="middle" class="d-x">A change is a new revision · DOC-2, DOC-20</text>
<path d="M260 142 L260 155" class="d-a" marker-end="url(#ah)"/>
<rect x="112" y="156" width="296" height="46" rx="8" class="d-step" stroke-width="1.2"/>
<text x="260.0" y="175.5" text-anchor="middle" class="d-b">The PRD</text>
<text x="260.0" y="190.5" text-anchor="middle" class="d-s">One Reviewed requirement, with its history</text>
<path d="M260 202 L260 215" class="d-a" marker-end="url(#ah)"/>
<rect x="112" y="216" width="296" height="42" rx="20" class="d-gate" stroke-width="1.2"/>
<text x="260.0" y="233.5" text-anchor="middle" class="d-b">Refused unless it names a requirement</text>
<text x="260.0" y="248.5" text-anchor="middle" class="d-x">No requirement? Change the PRD first · DEL-19</text>
<path d="M260 258 L260 271" class="d-a" marker-end="url(#ah)"/>
<rect x="112" y="272" width="296" height="46" rx="8" class="d-step" stroke-width="1.2"/>
<text x="260.0" y="291.5" text-anchor="middle" class="d-b">Goal</text>
<text x="260.0" y="306.5" text-anchor="middle" class="d-s">Frozen with done lines and requirement IDs</text>
<path d="M260 318 L260 331" class="d-a" marker-end="url(#ah)"/>
<rect x="112" y="332" width="296" height="42" rx="20" class="d-gate" stroke-width="1.2"/>
<text x="260.0" y="349.5" text-anchor="middle" class="d-b">The PRD is read-only while building</text>
<text x="260.0" y="364.5" text-anchor="middle" class="d-x">An edit to Reviewed text is refused · DOC-22</text>
<path d="M260 374 L260 387" class="d-a" marker-end="url(#ah)"/>
<rect x="112" y="388" width="296" height="46" rx="8" class="d-step" stroke-width="1.2"/>
<text x="260.0" y="407.5" text-anchor="middle" class="d-b">Build</text>
<text x="260.0" y="422.5" text-anchor="middle" class="d-s">A worker changes code, never the PRD</text>
<path d="M260 434 L260 447" class="d-a" marker-end="url(#ah)"/>
<rect x="112" y="448" width="296" height="42" rx="20" class="d-gate" stroke-width="1.2"/>
<text x="260.0" y="465.5" text-anchor="middle" class="d-b">Each named requirement needs a test</text>
<text x="260.0" y="480.5" text-anchor="middle" class="d-x">Seen failing, then passing · REG-1</text>
<path d="M260 490 L260 503" class="d-a" marker-end="url(#ah)"/>
<rect x="112" y="504" width="296" height="46" rx="8" class="d-step" stroke-width="1.2"/>
<text x="260.0" y="523.5" text-anchor="middle" class="d-b">Tests</text>
<text x="260.0" y="538.5" text-anchor="middle" class="d-s">Prove the requirement on the change</text>
<path d="M260 550 L260 563" class="d-a" marker-end="url(#ah)"/>
<rect x="112" y="564" width="296" height="42" rx="20" class="d-gate" stroke-width="1.2"/>
<text x="260.0" y="581.5" text-anchor="middle" class="d-b">Only a goal's pull request reaches main</text>
<text x="260.0" y="596.5" text-anchor="middle" class="d-x">Anything else is flagged · DEL-18</text>
<path d="M260 606 L260 619" class="d-a" marker-end="url(#ah)"/>
<rect x="112" y="620" width="296" height="46" rx="8" class="d-step" stroke-width="1.2"/>
<text x="260.0" y="639.5" text-anchor="middle" class="d-b">Release</text>
<text x="260.0" y="654.5" text-anchor="middle" class="d-s">Main moves; notes list the requirements</text>
<path d="M112 411 H53 V63 H111" class="d-a" marker-end="url(#ah)"/>
<rect x="4" y="196" width="98" height="96" rx="8" class="d-find" stroke-width="1.2"/>
<text x="53.0" y="218.0" text-anchor="middle" class="d-b">Gap found</text>
<text x="53.0" y="233.0" text-anchor="middle" class="d-x">Filed as a</text>
<text x="53.0" y="248.0" text-anchor="middle" class="d-x">finding. You</text>
<text x="53.0" y="263.0" text-anchor="middle" class="d-x">approve any</text>
<text x="53.0" y="278.0" text-anchor="middle" class="d-x">new revision</text>
<rect x="10" y="684" width="400" height="62" rx="8" class="d-step" stroke-width="1.2"/>
<text x="210.0" y="704.0" text-anchor="middle" class="d-b">Health checks it every day: Traceability</text>
<text x="210.0" y="719.0" text-anchor="middle" class="d-s">A commit with no goal, or a goal with no</text>
<text x="210.0" y="734.0" text-anchor="middle" class="d-s">requirement, becomes a finding</text>
<rect x="12" y="764" width="14" height="14" rx="3" class="d-you" stroke-width="1.2"/>
<text x="31" y="775" class="d-x">You</text>
<rect x="74" y="764" width="14" height="14" rx="3" class="d-step" stroke-width="1.2"/>
<text x="93" y="775" class="d-x">Step</text>
<rect x="140" y="764" width="14" height="14" rx="3" class="d-gate" stroke-width="1.2"/>
<text x="159" y="775" class="d-x">Gate that refuses</text>
<rect x="272" y="764" width="14" height="14" rx="3" class="d-find" stroke-width="1.2"/>
<text x="291" y="775" class="d-x">Finding</text>
</svg>
